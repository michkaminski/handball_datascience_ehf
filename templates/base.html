<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}EHF{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='ehf.css') }}">
  </head>
  <body>
    <div class="frame">
      <header class="mast">
        <a class="mark" href="{{ url_for('home') }}">
          <span class="mark-kicker">European Handball</span>
          <span class="mark-name">EHF</span>
        </a>
        <nav>
          <a href="{{ url_for('home') }}" class="{% if aktywna == 'przeglad' %}on{% endif %}">Przegląd</a>
          <a href="{{ url_for('mecze') }}" class="{% if aktywna == 'mecze' %}on{% endif %}">Mecze</a>
        </nav>
      </header>
      <main>
        {% block tresc %}{% endblock %}
      </main>
    </div>
  </body>
</html>
