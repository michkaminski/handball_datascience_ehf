<dialog id="match-detail-dialog" class="match-detail-dialog" aria-labelledby="match-detail-title">
<div class="modal-head">
<h2 id="match-detail-title">Match details</h2>
<button class="close" type="button" data-detail-close aria-label="Close match details" autofocus>×</button>
</div>
<div class="modal-body" data-detail-content aria-live="polite"></div>
<div class="modal-foot">
<a class="btn secondary" data-detail-tab target="_blank" rel="noopener">Open in new tab</a>
<button class="btn secondary" type="button" data-detail-close>Close</button>
</div>
</dialog>
