<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Protokół meczu</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #fff; --ink: #1d2330; --muted: #6b7280; --line: #e3e6ea;
    --a: #1f5fbf; --a-soft: #e6eefb; --b: #c0392b; --b-soft: #fbe9e7;
    --pen: #8e44ad; --ok: #2e7d32; --warn: #b7791f;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: #fff;
           border-radius: 8px; padding: 8px 12px; color: var(--ink); }
  button:active { transform: scale(.97); }
  input { font: inherit; padding: 8px; border: 1px solid var(--line); border-radius: 8px; width: 100%; }
  [hidden] { display: none !important; }

  /* ekran startowy */
  .start { max-width: 560px; margin: 12vh auto; padding: 24px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; text-align: center; }
  .start h1 { margin: 0 0 6px; font-size: 22px; }
  .start p { color: var(--muted); margin: 6px 0 16px; }
  .start .big { font-size: 18px; font-weight: 700; padding: 14px 22px; background: var(--ink); color: #fff; border-color: var(--ink); }
  .start .stack { display: grid; gap: 10px; justify-items: center; }

  header { background: var(--card); border-bottom: 1px solid var(--line); padding: 8px 16px; }
  .meta { color: var(--muted); font-size: 13px; text-align: center; }
  .board { display: grid; grid-template-columns: 1fr auto auto auto 1fr; align-items: center; gap: 12px; margin-top: 6px; }
  .team-name { font-weight: 700; font-size: 17px; }
  .team-name.a { color: var(--a); text-align: right; } .team-name.b { color: var(--b); }
  .score { font-size: 42px; font-weight: 800; font-variant-numeric: tabular-nums; text-align: center; min-width: 150px; }
  .score small { display: block; font-size: 13px; font-weight: 500; color: var(--muted); }
  .gbtn { font-size: 18px; font-weight: 700; padding: 14px 18px; color: #fff; border: 0; }
  .gbtn.a { background: var(--a); } .gbtn.b { background: var(--b); }
  .clockbar { display: flex; gap: 6px; align-items: center; justify-content: center; margin-top: 6px; flex-wrap: wrap; }
  .clockbar .t { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 70px; text-align: center; }
  .on { background: var(--ink) !important; color: #fff !important; border-color: var(--ink) !important; }

  /* składy A | B obok siebie; przebieg (I | II połowa) obok na bardzo szerokim ekranie, inaczej pod spodem */
  main { display: grid; grid-template-columns: 1fr; gap: 12px; padding: 12px 16px; align-items: start; }
  .col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: start; }
  .halves { display: grid; grid-template-columns: 1fr 1fr; }
  .halves > div + div { border-left: 1px solid var(--line); }
  @media (max-width: 699px) {
    .col { grid-template-columns: 1fr; }
    .halves { grid-template-columns: 1fr; } .halves > div + div { border-left: 0; border-top: 1px solid var(--line); }
    .board { grid-template-columns: 1fr auto 1fr; }
    .board .gbtn { grid-row: 2; } .board .gbtn.a { grid-column: 1; } .board .gbtn.b { grid-column: 3; }
    .score { min-width: 0; font-size: 34px; }
  }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .card h2 { margin: 0; padding: 8px 12px; font-size: 14px; border-bottom: 1px solid var(--line); }
  .card.a h2 { background: var(--a-soft); color: var(--a); } .card.b h2 { background: var(--b-soft); color: var(--b); }
  h4 { margin: 0; padding: 6px 10px; font-size: 13px; background: #fafafa; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; }

  table { width: 100%; border-collapse: collapse; }
  td, th { padding: 5px 6px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; }
  .nr { font-weight: 700; width: 32px; text-align: right; font-variant-numeric: tabular-nums; }
  .pos { color: var(--muted); font-size: 12px; width: 16px; }
  .g { font-weight: 800; text-align: center; width: 34px; font-variant-numeric: tabular-nums; }
  .g7 { color: var(--pen); font-size: 12px; text-align: center; width: 38px; }
  .zero { color: #c8ccd2; font-weight: 400; }
  .st { width: 28px; text-align: center; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  td.st { background: rgba(0, 0, 0, .018); }
  /* delikatne kolory pozycji: bramkarz, rozgrywający, skrzydłowy, obrotowy */
  tr.pB td { background-color: #f3faf4; } tr.pR td { background-color: #f4f7fd; }
  tr.pS td { background-color: #fdf9f0; } tr.pO td { background-color: #f9f4fc; }
  tr.pB .pos { color: #3d8b4f; } tr.pR .pos { color: #4a6fb5; } tr.pS .pos { color: #a8802a; } tr.pO .pos { color: #8a5aa8; }
  .pos { font-weight: 700; } .st.top { font-weight: 800; color: var(--ink); }
  .g { border-left: 1px solid var(--line); }
  .k { width: 26px; text-align: center; font-weight: 800; font-variant-numeric: tabular-nums; }
  .k.kW { color: #8a6d00; } .k.k2 { color: var(--warn); } .k.kD { color: #fff; background: var(--b); }
  .act { width: 1%; white-space: nowrap; text-align: right; }
  .act button { padding: 6px 10px; font-size: 13px; font-weight: 700; }
  .act .bg.a { color: var(--a); border-color: var(--a); } .act .bg.b { color: var(--b); border-color: var(--b); }
  .act .bk { color: var(--warn); border-color: var(--warn); }
  .chips { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 2px; }
  .chip { font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 10px; background: #fff4e0; color: var(--warn); cursor: pointer; border: 1px solid #f1d9a8; }
  .chip.D, .chip.N { background: #fde8e8; color: var(--b); border-color: #f3c0c0; }
  .chip.W { background: #fff9c4; color: #8a6d00; border-color: #eadf8a; }
  .officials { padding: 6px 10px; font-size: 13px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .officials button { padding: 4px 8px; font-size: 12px; }

  .ev td { font-size: 14px; cursor: pointer; padding: 4px 5px; }
  .ev .nth { color: var(--muted); font-weight: 600; font-size: 12px; }
  .ev tr.a td:first-child { border-left: 4px solid var(--a); }
  .ev tr.b td:first-child { border-left: 4px solid var(--b); }
  .ev tr.kara td { background: #fffbf3; color: #6b5a3a; font-size: 13px; }
  .ev .min { white-space: nowrap; width: 30px; font-variant-numeric: tabular-nums; }
  .ev .sc { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; width: 40px; }
  .ev .none { color: var(--b); font-style: italic; }
  /* przebieg jak na protokole: zawodnik A po lewej, wynik w środku, zawodnik B po prawej */
  .ev { table-layout: fixed; }
  .ev .sc { text-align: center; }
  .ev .side { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ev td.side.a { background: var(--a-soft); } .ev td.side.b { background: var(--b-soft); text-align: right; }
  .ev .side.a b { color: var(--a); } .ev .side.b b { color: var(--b); }
  .ev .side .note { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* strzelcy w przebiegu drobną czcionką */
  .ev td.side { font-size: 11px; }
  .ev .side .nth, .ev .side .tag, .ev .side .chip, .ev .side .note { font-size: .85em; }
  .ev .evh th { font-size: 11px; font-weight: 700; padding: 3px 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ev .evh th.a { color: var(--a); } .ev .evh th.b { color: var(--b); text-align: right; }
  .pname .sn, .pname .fn { overflow: hidden; text-overflow: ellipsis; }
  .tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 10px; margin-left: 4px; background: #f3e5f5; color: var(--pen); }
  th.sortable { cursor: pointer; user-select: none; white-space: nowrap; }
  th.sortable:active { background: #eef0f3; }
  td.pname { cursor: pointer; }
  .fld { display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: var(--muted); font-weight: 600; }
  .fld.grow { flex: 1; } .w90 { width: 90px; }
  .tag.x { background: #eceff1; color: #546e7a; }
  .ev tr.miss td { color: var(--muted); } .ev tr.miss .sc { font-weight: 400; }
  .clockbar .t { cursor: pointer; }
  .note { display: block; color: var(--muted); font-size: 12px; }
  .empty { padding: 16px; text-align: center; color: var(--muted); font-size: 13px; }
  .summary { padding: 8px 12px; font-size: 13px; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; border-top: 1px solid var(--line); }
  .summary b { color: var(--ink); }

  footer { padding: 0 16px 24px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #fileStatus { font-size: 13px; margin-left: auto; }
  .dirty { background: var(--b) !important; color: #fff !important; border-color: var(--b) !important; }

  /* okno edycji */
  .ov { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none; align-items: flex-end; justify-content: center; z-index: 10; }
  .ov.show { display: flex; }
  /* okno: tytuł i przyciski zawsze widoczne, środek przewija się w razie potrzeby */
  .sheet { background: #fff; width: min(900px, 100%); max-height: 96vh; max-height: 96dvh; display: flex; flex-direction: column;
           border-radius: 14px 14px 0 0; padding: 10px 14px 10px; }
  .sheet h3 { margin: 0 0 4px; font-size: 17px; flex: none; }
  .sbody { overflow: auto; flex: 1; min-height: 0; }
  .srow { display: flex; gap: 18px; flex-wrap: wrap; }
  .lbl { font-size: 12px; color: var(--muted); font-weight: 600; margin: 8px 0 3px; }
  .pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 4px; }
  .pgrid button { text-align: left; padding: 3px 6px; line-height: 1.1; overflow: hidden; }
  .pgrid button b { font-size: 16px; display: block; }
  .pgrid button span { font-size: 10px; color: var(--muted); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pgrid button.sel { color: #fff; border-color: transparent; }
  .pgrid button.sel span { color: #fff; }
  .sheet.a .pgrid button.sel { background: var(--a); } .sheet.b .pgrid button.sel { background: var(--b); }
  .mgrid { display: grid; grid-template-columns: repeat(15, 1fr); gap: 4px; }
  @media (max-width: 700px) { .mgrid { grid-template-columns: repeat(10, 1fr); } }
  .mgrid button { padding: 8px 0; font-weight: 700; font-variant-numeric: tabular-nums; }
  .seg { display: flex; gap: 5px; flex-wrap: wrap; }
  .seg button { padding: 8px 14px; font-weight: 700; }
  .row { display: flex; gap: 10px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
  .actions { display: flex; gap: 8px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); flex: none; }
  .actions .primary { background: var(--ink); color: #fff; border-color: var(--ink); flex: 1; font-weight: 700; padding: 11px; }

  /* przebieg na pełny ekran */
  .card h2 { background: #f1f3f6; }
  .evhead { cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
  .evhead .open { font-size: 11px; font-weight: 600; color: var(--muted); }
  .df { font-weight: 700; font-size: 12px; text-align: right; width: 28px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .df.a { color: var(--a); } .df.b { color: var(--b); }
  .tov { position: fixed; inset: 0; background: var(--bg); z-index: 20; display: none; flex-direction: column; overflow: auto; padding: 0 16px 16px; }
  .tov.show { display: flex; }
  .tbar { position: sticky; top: 0; background: var(--bg); display: flex; justify-content: space-between; align-items: center; padding: 10px 0; font-size: 16px; z-index: 1; }
  .thead { display: grid; grid-template-columns: 1fr auto 1fr; gap: 16px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 16px; }
  .thead .tn { font-size: 20px; font-weight: 800; } .thead .tn.a { color: var(--a); text-align: right; } .thead .tn.b { color: var(--b); }
  .tsc { font-size: 44px; font-weight: 800; text-align: center; font-variant-numeric: tabular-nums; }
  .tsc small { display: block; font-size: 13px; color: var(--muted); font-weight: 500; }
  .tchart { background: var(--card); border: 1px solid var(--line); border-radius: 10px; margin-top: 10px; padding: 6px; }
  .tchart svg { display: block; }
  .tchart .gl { stroke: #eceef1; } .tchart .ht { stroke: #c9cdd3; stroke-dasharray: 4 3; } .tchart .zero { stroke: #9aa1ab; }
  .tchart .fa { fill: var(--a); opacity: .18; } .tchart .fb { fill: var(--b); opacity: .18; }
  .tchart .ln { fill: none; stroke: var(--ink); stroke-width: 2; vector-effect: non-scaling-stroke; }
  .tchart text { font-size: 10px; fill: var(--muted); } .tchart .la { fill: var(--a); font-weight: 700; } .tchart .lb { fill: var(--b); font-weight: 700; }
  .thalves { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 10px; align-items: start; }
  @media (max-width: 820px) { .thalves { grid-template-columns: 1fr; } }
  .thalves > div { background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .tl td { font-size: 15px; padding: 6px 8px; }
  .tl .min { width: 40px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .tl .sc { width: 64px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tl .df { font-size: 13px; width: 36px; }
  .tl .tteam { width: 30px; }
  .tbadge { display: inline-block; width: 22px; text-align: center; border-radius: 5px; color: #fff; font-size: 12px; font-weight: 800; }
  .tbadge.a { background: var(--a); } .tbadge.b { background: var(--b); }
  .tl tr.a td:first-child { border-left: 4px solid var(--a); } .tl tr.b td:first-child { border-left: 4px solid var(--b); }
  .tl tr.kara td { background: #fffbf3; font-size: 14px; } .tl tr.miss td { color: var(--muted); }
  .tl .nth { color: var(--muted); font-size: 13px; }
  #tSummary { background: var(--card); border: 1px solid var(--line); border-radius: 10px; margin-top: 10px; }
  .actions .del { color: var(--b); }

  /* tablet (także w pionie) i większe: wszystko na jednym ekranie — skład A | skład B | przebieg,
     każda kolumna przewija się w środku */
  @media (min-width: 700px) {
    #app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
    header { flex: none; padding: 3px 12px 4px; }
    .meta { font-size: 11px; }
    .board { margin-top: 0; gap: 10px; }
    .team-name { font-size: 15px; }
    .score { font-size: 28px; min-width: 110px; line-height: 1.05; }
    .score small { font-size: 11px; }
    .gbtn { padding: 7px 14px; font-size: 15px; }
    .clockbar { margin-top: 3px; gap: 4px; }
    .clockbar button { padding: 3px 9px; font-size: 13px; }
    .clockbar .t { font-size: 17px; }
    main { flex: 1; min-height: 0; padding: 8px 12px; gap: 8px;
           grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 350px; grid-template-rows: 100%; align-items: stretch; }
    .col { display: contents; }
    .card { overflow: auto; height: 100%; }
    .card h2 { position: sticky; top: 0; z-index: 1; padding: 6px 10px; }
    td, th { padding: 2px 4px; font-size: 11px; }
    th { font-size: 10px; }
    .st, .g7, .pos { font-size: 10px; }
    /* nazwisko w jednej linii — niższe wiersze */
    td.pname { max-width: 1px; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chip { font-size: 10px; padding: 0 5px; }
    .chips { margin-top: 0; }
    .act button { padding: 5px 11px; font-size: 13px; border-radius: 7px; min-width: 40px; }
    .officials { padding: 4px 8px; font-size: 12px; }
    .officials button { padding: 2px 7px; }
    .st, .k { width: 22px; }
    .halves { grid-template-columns: 1fr; }
    .halves > div + div { border-left: 0; border-top: 1px solid var(--line); }
    .ev td { font-size: 11px; padding: 3px 4px; }
    .ev tr.kara td { font-size: 11px; }
    .ev td.side, .ev tr.kara td.side { font-size: 9px; }
    footer { flex: none; padding: 4px 12px 6px; gap: 6px; }
    footer button { padding: 4px 10px; font-size: 13px; }
    #statsNote { display: none; }
  }
  /* węższy tablet: bez rocznika i liczby meczów, węższy przebieg */
  @media (min-width: 1000px) and (max-width: 1199px) {
    .opt { display: none; }
    main { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 290px; padding: 6px 8px; gap: 6px; }
    .act button { padding: 5px 9px; }
    .clockbar button { padding: 5px 8px; }
  }
  /* tablet w pionie: mniejsze czcionki, bez rocznika, meczów i średniej, imię pod nazwiskiem, wąski przebieg */
  @media (min-width: 700px) and (max-width: 999px) {
    .opt, .opt2 { display: none; }
    main { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 240px; padding: 5px 6px; gap: 5px; }
    .team-name { font-size: 13px; }
    .gbtn { padding: 6px 10px; font-size: 13px; }
    .clockbar button { padding: 4px 7px; }
    td, th { padding: 1px 2px; font-size: 10px; }
    th { font-size: 9px; }
    .nr { width: 20px; } .pos { width: 12px; } .st, .k { width: 17px; } .g { width: 22px; } .g7 { width: 26px; }
    td.pname { white-space: normal; line-height: 1.1; }
    .pname .sn, .pname .fn { display: block; white-space: nowrap; }
    .pname .fn { font-size: 9px; color: var(--muted); }
    .act button { padding: 5px 6px; font-size: 12px; min-width: 28px; }
    .officials { font-size: 10px; padding: 3px 4px; gap: 3px; }
    .officials button { padding: 1px 4px; font-size: 10px; }
    .ev td { font-size: 10px; padding: 2px 3px; }
    .ev .min { width: 24px; } .ev .sc { width: 34px; }
    .ev td.side, .ev tr.kara td.side { font-size: 8px; }
    .ev .evh th { font-size: 10px; padding: 2px 3px; }
    #fileStatus { font-size: 11px; }
  }
  @media (min-width: 1500px) { main { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 470px; } }
  /* niski ekran (np. 1024×700): bez linii z opisem meczu (jest w pełnoekranowym przebiegu), ciaśniejsze odstępy */
  @media (min-width: 700px) and (max-height: 760px) {
    .meta { display: none; }
    header { padding: 4px 12px 3px; }
    main { padding-top: 5px; padding-bottom: 3px; }
    .card h2 { padding: 4px 10px; font-size: 13px; }
    h4 { padding: 4px 8px; }
    footer { padding: 2px 12px 4px; }
    footer button { padding: 3px 9px; }
  }
</style>
</head>
<body>

<div class="start" id="startScreen">
  <h1>Protokół meczu</h1>
  <p>Otwórz plik JSON meczu — z niego wczytają się drużyny i składy, a każda zmiana zapisze się z powrotem do tego pliku.</p>
  <div class="stack">
    <button class="big" onclick="openFile()">Otwórz plik JSON</button>
    <p id="startNote"></p>
  </div>
</div>
<input type="file" id="fileInput" accept=".json,application/json" hidden onchange="readPicked(this)">

<div id="app" hidden>
<header>
  <div class="meta" id="meta"></div>
  <div class="board">
    <div class="team-name a" id="nameA"></div>
    <button class="gbtn a" onclick="openGoal('A')">+ GOL A</button>
    <div class="score"><span id="score">0 : 0</span><small id="halfScore">do przerwy 0 : 0</small></div>
    <button class="gbtn b" onclick="openGoal('B')">+ GOL B</button>
    <div class="team-name b" id="nameB"></div>
  </div>
  <div class="clockbar">
    <button id="h1" onclick="setHalf(1)">I połowa</button>
    <button id="h2" onclick="setHalf(2)">II połowa</button>
    <span style="width:16px"></span>
    <button onclick="clockAdj(-60)">−1'</button>
    <button onclick="clockAdj(-10)">−10"</button>
    <button onclick="clockAdj(-1)">−1"</button>
    <span class="t" id="clock" onclick="clockSet()" title="stuknij, aby wpisać czas">00:00</span>
    <button onclick="clockAdj(1)">+1"</button>
    <button onclick="clockAdj(10)">+10"</button>
    <button onclick="clockAdj(60)">+1'</button>
    <button id="clockBtn" onclick="clockToggle()">▶</button>
  </div>
</header>

<main>
  <div class="col">
    <section class="card a"><h2 id="rosterTitleA"></h2><table id="rosterA"></table><div class="officials" id="offA"></div></section>

<div class="ov" id="ov" onclick="if(event.target===this)closeSheet()">
  <div class="sheet" id="sheet">
    <h3 id="sheetTitle"></h3>

      <div class="lbl" id="pLbl">Strzelec</div>

          <div class="lbl">Połowa</div>

<script>
/* Format pliku JSON:
   { "format": "protokol_live", "version": 1,
     "match": { "id", "competition", "date", "time", "venue",
                "capacity", "statsNote",   // opcjonalne
                "A": { "name", "short", "players": [{ "nr", "name", "pos": "B|R|S|O", "ur", "m", "br", "sr" }, ...] },
                // zawodnik może być też tablicą [nr, "NAZWISKO Imię", "poz"]; ur/m/br/sr (statystyki przedmeczowe) opcjonalne
                // bramkarz: "ob" (obrony), "rz" (rzuty na bramkę), "sk" (skuteczność w %) — opcjonalne
                "B": { ... } },
     "state": { "goals": [...], "pens": [...], "half", "clock", "seq", "updatedAt", "finished" } }   // "state" opcjonalny
   Plik HTML pobrany z serwisu ma ten dokument wbudowany (EMBEDDED) i otwiera go od razu. */

const EMBEDDED = {{ dokument|tojson }};
const EMBEDDED_FILE = {{ plik_json|tojson }};
const OFFICIALS = ['A', 'B', 'C', 'D', 'E'];
const PEN_TYPES = [['W', 'W — ostrzeżenie'], ['2', "2' — wykluczenie"], ['D', 'D — dyskwalifikacja'], ['N', 'N — niebieska kartka']];
const penLabel = t => t === '2' ? "2'" : t;
// składy: pozycja (B, R, S, O), potem nazwisko i imię
const POS_ORDER = { B: 1, R: 2, S: 3, O: 4 };
const byPos = (x, y) => (POS_ORDER[x[2]] || 9) - (POS_ORDER[y[2]] || 9) || x[1].localeCompare(y[1], 'pl');
const $ = id => document.getElementById(id);

// MATCH zapisywany do pliku bez zmian; ROSTER = składy do widoku: [nr, nazwisko, poz, {ur, m, br, sr, top}]
let MATCH = null, ROSTER = null, S = null;

// ---- dokument JSON ----
function blank() { return { goals: [], pens: [], half: 1, clock: { acc: 0, runningSince: null }, seq: 0, updatedAt: 0 }; }
function doc() { return { format: 'protokol_live', version: 1, savedAt: new Date().toISOString(), match: MATCH, state: S }; }
function applyDoc(d) {
  if (!d || !d.match || !d.match.A || !d.match.B) throw new Error('brak sekcji „match” z drużynami A i B');
  MATCH = d.match;
  ['A', 'B'].forEach(t => MATCH[t].short = MATCH[t].short || MATCH[t].name);
  buildRoster();
  S = d.state && Array.isArray(d.state.goals) ? d.state : blank();
  S.pens = S.pens || [];
  S.clock = S.clock || { acc: 0, runningSince: null };
  $('startScreen').hidden = true;
  $('app').hidden = false;
  renderTitles(); render();
}

function buildRoster() {
  ROSTER = {};
  ['A', 'B'].forEach(t => {
    ROSTER[t] = (MATCH[t].players || []).map(p => Array.isArray(p)
      ? [Number(p[0]), String(p[1]), p[2] || '', {}]
      : [Number(p.nr), String(p.name), p.pos || '', { ur: p.ur, m: p.m, br: p.br, sr: p.sr, ob: p.ob, rz: p.rz, sk: p.sk }]);
    // 4 najlepszych strzelców sezonu — pogrubieni, jak na protokole
    [...ROSTER[t]].filter(p => p[3].br > 0).sort((x, y) => y[3].br - x[3].br).slice(0, 4).forEach(p => p[3].top = true);
  });
}

// ---- sortowanie składów (tylko widok, nie zapisuje się) ----
let SORT = { key: 'pos', dir: 1 };
const birthYear = ur => ur === '' || ur == null ? null : +ur < 100 ? (+ur > 30 ? 1900 : 2000) + +ur : +ur;
const SORT_KEYS = { nr: p => p[0], name: p => p[1], ur: p => birthYear(p[3].ur), m: p => p[3].m, br: p => p[3].br, sr: p => p[3].sr, sk: p => p[3].sk };
// kolumna skuteczności bramkarzy tylko wtedy, gdy plik ją zawiera
const hasSaves = () => ['A', 'B'].some(t => ROSTER[t].some(p => p[3].sk != null));
function sortedRoster(team) {
  const r = [...ROSTER[team]];
  if (SORT.key === 'pos') return r.sort((x, y) => SORT.dir * byPos(x, y));
  const f = SORT_KEYS[SORT.key];
  return r.sort((x, y) => {
    const a = f(x), b = f(y);
    if (a == null || b == null) return (a == null) - (b == null) || byPos(x, y);  // puste na koniec
    return SORT.dir * (typeof a === 'string' ? a.localeCompare(b, 'pl') : a - b) || byPos(x, y);
  });
}
function setSort(k) {
  // statystyki sezonu najpierw malejąco, reszta rosnąco
  SORT = SORT.key === k ? { key: k, dir: -SORT.dir } : { key: k, dir: ['m', 'br', 'sr', 'sk'].includes(k) ? -1 : 1 };
  render();
}

// ---- dopisywanie / edycja / usuwanie zawodnika (zapisuje się w „match” pliku) ----
const POSITIONS = [['B', 'B — bramkarz'], ['R', 'R — rozgrywający'], ['S', 'S — skrzydłowy'], ['O', 'O — obrotowy']];
let pedit = null;
function openPlayer(team, nr = null) {
  const p = nr == null ? null : ROSTER[team].find(x => x[0] === nr);
  pedit = { team, orig: nr, pos: p ? p[2] : 'R' };
  $('pTitle').textContent = (p ? 'Zawodnik' : 'Nowy zawodnik') + ' — ' + MATCH[team].short;
  $('pNr').value = p ? p[0] : '';
  $('pName').value = p ? p[1] : '';
  $('pUr').value = p && p[3].ur || '';
  $('pDel').style.display = p ? '' : 'none';
  renderPos();
  $('pov').classList.add('show');
}
function renderPos() {
  $('pPos').innerHTML = '';
  POSITIONS.forEach(([v, label]) => {
    const b = document.createElement('button');
    b.textContent = label; b.className = pedit.pos === v ? 'on' : '';
    b.onclick = () => { pedit.pos = v; renderPos(); };
    $('pPos').appendChild(b);
  });
}
function closePlayer() { $('pov').classList.remove('show'); pedit = null; }
// zawodnicy w pliku ujednoliceni do obiektów {nr, name, pos, ...statystyki}
function playerObjs(team) {
  return MATCH[team].players = (MATCH[team].players || []).map(p =>
    Array.isArray(p) ? { nr: Number(p[0]), name: String(p[1]), pos: p[2] || '' } : p);
}
function savePlayer() {
  const nr = parseInt($('pNr').value, 10), name = $('pName').value.trim(), ur = $('pUr').value.trim();
  if (!(nr >= 0) || !name) { alert('Podaj numer i nazwisko'); return; }
  const { team, orig } = pedit, list = playerObjs(team);
  if (nr !== orig && list.some(p => Number(p.nr) === nr)) { alert('Numer ' + nr + ' jest już w składzie'); return; }
  if (orig == null) list.push({ nr, name, pos: pedit.pos, ur });
  else {
    Object.assign(list.find(p => Number(p.nr) === orig), { nr, name, pos: pedit.pos, ur });
    // zmiana numeru — gole i kary idą za zawodnikiem
    if (nr !== orig) [...S.goals, ...S.pens].forEach(e => { if (e.team === team && e.nr === orig) e.nr = nr; });
  }
  buildRoster(); save(); closePlayer(); render();
}
function deletePlayer() {
  const { team, orig } = pedit;
  if ([...S.goals, ...S.pens].some(e => e.team === team && e.nr === orig)) {
    alert('Zawodnik ma gole lub kary — najpierw je usuń albo przypisz innemu zawodnikowi.');
    return;
  }
  if (!confirm('Usunąć zawodnika z protokołu?')) return;
  MATCH[team].players = playerObjs(team).filter(p => Number(p.nr) !== orig);
  buildRoster(); save(); closePlayer(); render();
}

// ---- odczyt i zapis pliku ----
// Cały mecz (składy i zdarzenia) zapisuje się tylko do pliku JSON; przeglądarka nic nie przechowuje.
// Chrome/Edge (także Chrome na Androidzie): „Zapisuj do pliku JSON” albo otwarty plik — zapis automatyczny po każdej zmianie.
// Inne przeglądarki: zapis przyciskiem „Pobierz JSON”.
const FS_OK = 'showOpenFilePicker' in window;
const SAVE_OK = 'showSaveFilePicker' in window;
const JSON_TYPES = [{ description: 'Protokół JSON', accept: { 'application/json': ['.json'] } }];
let fileHandle = null, fileName = '', writeQ = Promise.resolve(), dirty = false;

function fileStatus(msg, err) {
  $('fileStatus').textContent = msg;
  $('fileStatus').style.color = err ? 'var(--b)' : 'var(--ok)';
}
function setDirty(v) {
  dirty = v;
  $('downloadBtn').classList.toggle('dirty', v && !fileHandle && !SAVE_OK);
}
function fileUi() {
  $('connectBtn').hidden = !SAVE_OK || !!fileHandle;
}
function save() {
  S.updatedAt = Date.now();
  if (!fileHandle) {
    setDirty(true);
    fileStatus(SAVE_OK ? 'Niezapisane zmiany — kliknij „Zapisuj do pliku JSON”' : 'Niezapisane zmiany — kliknij „Pobierz JSON”', true);
    return;
  }
  writeQ = writeQ.then(async () => {
    try {
      const w = await fileHandle.createWritable();
      await w.write(JSON.stringify(doc(), null, 1));
      await w.close();
      fileStatus(`${fileName}: zapisano ${new Date().toLocaleTimeString('pl-PL')}`);
    } catch (e) { fileStatus(`Błąd zapisu do ${fileName}: ${e.message}`, true); }
  });
}
function loadText(text, name) {
  try { applyDoc(JSON.parse(text)); }
  catch (e) { alert('To nie jest poprawny plik protokołu: ' + e.message); return false; }
  fileName = name;
  setDirty(false);
  return true;
}
// tworzy (albo nadpisuje) plik JSON z całym meczem i od tej chwili każda zmiana zapisuje się do niego
async function connectJson() {
  try {
    const h = await showSaveFilePicker({ suggestedName: fileName || EMBEDDED_FILE || 'protokol.json', types: JSON_TYPES });
    fileHandle = h; fileName = h.name;
    setDirty(false); fileUi();
    save();
  } catch (e) { if (e.name !== 'AbortError') alert('Nie udało się zapisać pliku: ' + e.message); }
}
async function openFile() {
  if (dirty && !confirm('Są niezapisane zmiany. Otworzyć inny plik?')) return;
  if (!FS_OK) { $('fileInput').click(); return; }
  try {
    const [h] = await showOpenFilePicker({ types: JSON_TYPES });
    await attach(h);
  } catch (e) { if (e.name !== 'AbortError') alert('Nie udało się otworzyć pliku: ' + e.message); }
}
async function attach(h) {
  if (await h.requestPermission({ mode: 'readwrite' }) !== 'granted') { alert('Brak zgody na zapis do pliku'); return; }
  if (!loadText(await (await h.getFile()).text(), h.name)) return;
  fileHandle = h; fileUi();
  fileStatus(`${h.name}: otwarty, zapis automatyczny`);
}
function readPicked(inp) {
  const f = inp.files[0]; if (!f) return;
  f.text().then(t => {
    if (loadText(t, f.name)) { fileHandle = null; fileUi(); fileStatus(`${f.name}: tylko odczyt — zapisuj przyciskiem „Pobierz JSON”`, true); }
  }).finally(() => inp.value = '');
}
function downloadJson() {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(doc(), null, 1)], { type: 'application/json' }));
  a.download = fileName || `protokol_${MATCH.id}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  if (!fileHandle) { setDirty(false); fileStatus(`Pobrano ${a.download} ${new Date().toLocaleTimeString('pl-PL')}`); }
}
window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

function initStart() {
  // usuń dane zostawione w przeglądarce przez wcześniejszą wersję strony
  try { indexedDB.deleteDatabase('protokol_live'); } catch (e) {}
  if (EMBEDDED) { startEmbedded(); return; }
  if (!FS_OK) $('startNote').textContent = 'Ta przeglądarka nie zapisuje bezpośrednio do pliku — po zmianach używaj „Pobierz JSON”.';
}
// dane wbudowane w HTML pokazują się od razu; zapis do pliku JSON po wskazaniu pliku
function startEmbedded() {
  if (!loadText(JSON.stringify(EMBEDDED), EMBEDDED_FILE)) return;
  fileUi();
  fileStatus(SAVE_OK ? 'Kliknij „Zapisuj do pliku JSON” — cały mecz będzie zapisywany w pliku po każdej zmianie'
                     : 'Ta przeglądarka nie zapisuje do pliku — zapisuj mecz przyciskiem „Pobierz JSON”', true);
}

// ---- zegar ----
function clockSec() {
  const c = S.clock;
  return Math.max(0, Math.floor(c.acc + (c.runningSince ? (Date.now() - c.runningSince) / 1000 : 0)));
}
const fmt = sec => String(Math.floor(sec / 60)).padStart(2, '0') + ':' + String(sec % 60).padStart(2, '0');
function clockToggle() {
  const c = S.clock;
  if (c.runningSince) { c.acc = clockSec(); c.runningSince = null; } else c.runningSince = Date.now();
  save(); renderClock();
}
function clockAdj(d) {
  S.clock.acc = Math.max(0, clockSec() + d);
  if (S.clock.runningSince) S.clock.runningSince = Date.now();
  save(); renderClock();
}
function clockSet() {
  const v = prompt('Czas meczu (mm:ss)', fmt(clockSec()));
  const m = v && v.trim().match(/^(\d{1,2})(?::(\d{1,2}))?$/);
  if (!m) return;
  S.clock.acc = (+m[1]) * 60 + (+(m[2] || 0));
  if (S.clock.runningSince) S.clock.runningSince = Date.now();
  save(); renderClock();
}
function setHalf(h) {
  if (h === 2 && S.half === 1 && clockSec() > 0 && clockSec() < 30 * 60 &&
      confirm('Ustawić zegar na 30:00 (start II połowy)?')) {
    S.clock = { acc: 30 * 60, runningSince: null };
  }
  S.half = h; save(); renderClock();
}
function renderClock() {
  $('clock').textContent = fmt(clockSec());
  $('clockBtn').textContent = S.clock.runningSince ? '⏸' : '▶';
  $('h1').classList.toggle('on', S.half === 1);
  $('h2').classList.toggle('on', S.half === 2);
}
setInterval(() => { if (S && S.clock.runningSince) $('clock').textContent = fmt(clockSec()); }, 500);

// ---- pomocnicze ----
function person(team, nr) {
  if (nr == null) return null;
  if (OFFICIALS.includes(nr)) return [nr, 'osoba tow. ' + nr, ''];
  return ROSTER[team].find(p => p[0] === nr) || [nr, '?', ''];
}
// nazwisko z „NAZWISKO Imię” = początkowe wyrazy pisane wielkimi literami
function surname(p) {
  if (OFFICIALS.includes(p[0])) return 'os. tow.';
  const words = p[1].split(/\s+/), up = words.filter((w, i) => words.slice(0, i + 1).every(x => x === x.toUpperCase() && /\p{Lu}/u.test(x)));
  return up.length ? up.join(' ') : words[0];
}
const halfRange =h => h === 1 ? [1, 30] : [31, 60];
// połowa i minuta podpowiadane: z zegara (jeśli ruszony), inaczej bieżąca połowa i minuta ostatniego zdarzenia w niej
function suggestTime() {
  const sec = clockSec();
  if (sec > 0) {
    const min = Math.min(60, Math.floor(sec / 60) + 1);
    return { half: min > 30 ? 2 : 1, min };
  }
  const mins = [...S.goals, ...S.pens].filter(e => e.half === S.half && e.min != null).map(e => e.min);
  return { half: S.half, min: mins.length ? Math.max(...mins) : null };
}

// ---- okno: gol / kara ----
let edit = null;
function openGoal(team, nr = null) {
  edit = { kind: 'goal', id: null, team, nr, pen: false, miss: false, note: '', ...suggestTime() };
  openSheet();
}
function setShot(pen, miss) { edit.pen = pen; edit.miss = miss; renderSheet(); }
function openPen(team, nr) {
  edit = { kind: 'pen', id: null, team, nr, type: '2', note: '', ...suggestTime() };
  openSheet();
}
function editItem(kind, id) {
  const src = kind === 'goal' ? S.goals : S.pens;
  edit = { kind, ...src.find(e => e.id === id) };
  openSheet();
}
function openSheet() {
  $('fNote').value = edit.note || '';
  renderSheet();
  $('ov').classList.add('show');
}
function sheetHalf(h) {
  if (edit.min != null && edit.half !== h) edit.min += (h - edit.half) * 30;
  edit.half = h; renderSheet();
}
function renderSheet() {
  const tm = MATCH[edit.team], isGoal = edit.kind === 'goal';
  $('sheet').className = 'sheet ' + edit.team.toLowerCase();
  const what = !isGoal ? 'Kara' : edit.miss ? 'Karny niewykorzystany' : edit.pen ? 'Gol z 7m' : 'Gol';
  $('sheetTitle').textContent = (edit.id ? 'Edycja — ' : '') + what + ' — ' + tm.short;
  $('pLbl').textContent = !isGoal ? 'Zawodnik / osoba' : edit.pen ? 'Wykonawca' : 'Strzelec';
  $('goalBox').style.display = isGoal ? '' : 'none';
  $('penBox').style.display = isGoal ? 'none' : '';
  $('shotN').classList.toggle('on', !edit.pen);
  $('shot7').classList.toggle('on', !!edit.pen && !edit.miss);
  $('shot7x').classList.toggle('on', !!edit.miss);

  const opts = isGoal ? [[null, '?', 'później']] : [];
  [...ROSTER[edit.team]].sort((x, y) => x[0] - y[0]).forEach(p => opts.push([p[0], p[0], p[1]]));
  if (!isGoal) OFFICIALS.forEach(o => opts.push([o, o, 'osoba tow.']));
  $('pgrid').innerHTML = '';
  opts.forEach(([v, big, small]) => {
    const b = document.createElement('button');
    b.innerHTML = `<b>${big}</b><span>${esc(small)}</span>`;
    b.className = edit.nr === v ? 'sel' : '';
    b.onclick = () => { edit.nr = v; renderSheet(); };
    $('pgrid').appendChild(b);
  });

  $('typeSeg').innerHTML = '';
  PEN_TYPES.forEach(([t, label]) => {
    const b = document.createElement('button');
    b.textContent = label; b.className = edit.type === t ? 'on' : '';
    b.onclick = () => { edit.type = t; renderSheet(); };
    $('typeSeg').appendChild(b);
  });

  $('sh1').classList.toggle('on', edit.half === 1);
  $('sh2').classList.toggle('on', edit.half === 2);
  $('mNone').classList.toggle('on', edit.min == null);
  const [lo, hi] = halfRange(edit.half);
  $('mgrid').innerHTML = '';
  for (let m = lo; m <= hi; m++) {
    const b = document.createElement('button');
    b.textContent = m; b.className = edit.min === m ? 'on' : '';

function render() {

// zdarzenia chronologicznie z wynikiem narastająco i numerem gola strzelca
function timeline() {
  const ev = [...S.goals.map(g => ({ ...g, kind: 'goal' })), ...S.pens.map(p => ({ ...p, kind: 'pen' }))].sort(byTime);
  let a = 0, b = 0;
  const nth = {}, end = {};
  const events = ev.map(e => {
    const p = person(e.team, e.nr), r = { ...e, p };
    if (e.kind === 'goal' && !e.miss) {
      e.team === 'A' ? a++ : b++;
      if (p) r.nth = nth[e.team + e.nr] = (nth[e.team + e.nr] || 0) + 1;
    }
    r.a = a; r.b = b;
    end[e.half] = `${a} : ${b}`;
    return r;
  });
  return { events, end };
}
// przewaga: +n gospodarze (A), -n goście (B), 0 remis
const diffTxt = d => d > 0 ? '+' + d : String(d);
const diffTd = d => `<td class="df ${d > 0 ? 'a' : d < 0 ? 'b' : ''}">${diffTxt(d)}</td>`;

// wykres przewagi w czasie: nad osią gospodarze, pod osią goście
function leadChart(goals) {
  const W = Math.max(300, ($('tChart').clientWidth || 612) - 12), H = 130, mid = H / 2;
  const maxAbs = Math.max(3, ...goals.map(g => Math.abs(g.a - g.b)));
  const x = min => (Math.min(60, Math.max(0, min)) / 60) * W, y = d => mid - (d / maxAbs) * (mid - 8);
  let path = `M0,${mid}`, lastMin = 0;
  goals.forEach(g => {
    const mn = g.min != null ? g.min - 0.5 : lastMin;
    lastMin = Math.max(lastMin, mn);
    path += ` H${x(lastMin).toFixed(1)} V${y(g.a - g.b).toFixed(1)}`;
  });
  const endMin = Math.max(lastMin, Math.min(60, Math.floor(clockSec() / 60)));
  path += ` H${x(endMin).toFixed(1)}`;
  const area = `${path} V${mid} Z`;
  const grid = [10, 20, 30, 40, 50].map(mn =>
    `<line x1="${x(mn)}" x2="${x(mn)}" y1="0" y2="${H}" class="${mn === 30 ? 'ht' : 'gl'}"/><text x="${x(mn) + 3}" y="${H - 3}">${mn}'</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">
    <defs><clipPath id="cA"><rect x="0" y="0" width="${W}" height="${mid}"/></clipPath>
          <clipPath id="cB"><rect x="0" y="${mid}" width="${W}" height="${mid}"/></clipPath></defs>
    ${grid}<line x1="0" x2="${W}" y1="${mid}" y2="${mid}" class="zero"/>
    <path d="${area}" clip-path="url(#cA)" class="fa"/><path d="${area}" clip-path="url(#cB)" class="fb"/>
    <path d="${path}" class="ln"/>
    <text x="4" y="12" class="la">+${maxAbs} ${esc(MATCH.A.short)}</text><text x="4" y="${H - 14}" class="lb">-${maxAbs} ${esc(MATCH.B.short)}</text>
  </svg>`;
}

// ---- koniec meczu: raport HTML (osobna strona do zapisania i wydruku) ----
function endMatch() {
  if (!S.finished && !confirm('Zakończyć mecz i utworzyć raport?')) return;
  if (S.clock.runningSince) { S.clock.acc = clockSec(); S.clock.runningSince = null; }
  if (!S.finished) { S.finished = Date.now(); save(); }
  render();
  const name = (fileName || EMBEDDED_FILE || 'protokol.json').replace(/\.json$/i, '') + '_raport.html';
  const url = URL.createObjectURL(new Blob([reportHtml(name)], { type: 'text/html' }));
  const w = window.open(url, '_blank');
  if (!w) { const a = document.createElement('a'); a.href = url; a.download = name; a.click(); }
  setTimeout(() => URL.revokeObjectURL(url), 60000);

// statystyki meczu z goli i kar: przewagi, serie, remisy, zmiany prowadzenia, bramki w odcinkach 10 minut
function matchStats(goals) {
  const st = {};
  ['A', 'B'].forEach(t => {
    const g = S.goals.filter(x => x.team === t), ok = g.filter(x => !x.miss), p = S.pens.filter(x => x.team === t);
    st[t] = { goals: ok.length, h1: ok.filter(x => x.half === 1).length, h2: ok.filter(x => x.half === 2).length,
      s7: g.filter(x => x.pen).length, s7g: ok.filter(x => x.pen).length,
      W: p.filter(x => x.type === 'W').length, two: p.filter(x => x.type === '2').length, D: p.filter(x => x.type === 'D' || x.type === 'N').length,
      lead: 0, leadMin: null, run: 0, runFrom: null, runTo: null };
  });
  let runTeam = null, run = 0, runFrom = null, ties = 0, changes = 0, leader = null;
  const seg = [0, 1, 2, 3, 4, 5].map(() => ({ A: 0, B: 0 }));
  goals.forEach(e => {
    const d = e.a - e.b;
    if (d > st.A.lead) { st.A.lead = d; st.A.leadMin = e.min; }
    if (-d > st.B.lead) { st.B.lead = -d; st.B.leadMin = e.min; }
    if (e.team === runTeam) run++; else { runTeam = e.team; run = 1; runFrom = e.min; }
    if (run > st[runTeam].run) Object.assign(st[runTeam], { run, runFrom, runTo: e.min });
    if (d === 0) ties++;
    const now = d > 0 ? 'A' : d < 0 ? 'B' : null;
    if (now && leader && now !== leader) changes++;
    if (now) leader = now;
    if (e.min != null) seg[Math.min(5, Math.floor((e.min - 1) / 10))][e.team]++;
  });
  return { st, ties, changes, seg };
}

  path += ` H${x(S.finished ? 60 : Math.max(lastMin, Math.min(60, Math.floor(clockSec() / 60)))).toFixed(1)}`;

    <text x="${L + 6}" y="20" class="la">${esc(MATCH.A.short)} prowadzi</text>
    <text x="${L + 6}" y="${H - 22}" class="lb">${esc(MATCH.B.short)} prowadzi</text>
  </svg>`;
}

function reportSegChart(seg) {
  const W = 1000, H = 190, B0 = H - 26, max = Math.max(1, ...seg.flatMap(s => [s.A, s.B]));
  const gw = (W - 20) / 6, bw = Math.min(46, gw / 3), h = v => (v / max) * (B0 - 22);
  const bars = seg.map((s, i) => {
    const cx = 10 + gw * i + gw / 2;
    return ['A', 'B'].map((t, j) => {
      const bx = cx + (j ? 3 : -3 - bw), v = s[t];
      return `<rect x="${bx}" y="${B0 - h(v)}" width="${bw}" height="${h(v)}" class="b${t.toLowerCase()}" rx="3"/>` +
        `<text x="${bx + bw / 2}" y="${B0 - h(v) - 5}" text-anchor="middle" class="v${t.toLowerCase()}">${v}</text>`;
    }).join('') + `<text x="${cx}" y="${H - 6}" text-anchor="middle">${i * 10 + 1}–${i * 10 + 10}'</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Bramki w odcinkach 10 minut"><line x1="10" x2="${W - 10}" y1="${B0}" y2="${B0}" class="zero"/><line x1="${W / 2}" x2="${W / 2}" y1="8" y2="${B0}" class="ht"/>${bars}</svg>`;
}

function reportHtml(name) {
  const m = MATCH, T = timeline(), goals = T.events.filter(e => e.kind === 'goal' && !e.miss), R = matchStats(goals), st = R.st;
  const last = goals[goals.length - 1] || { a: 0, b: 0 }, ht = goals.filter(e => e.half === 1).pop() || { a: 0, b: 0 };
  const meta = [m.competition, [m.date, m.time && 'godz. ' + m.time].filter(Boolean).join(' '), m.venue].filter(Boolean).map(esc).join(' · ');
  const nz = v => v ? v : '<span class="z">·</span>';
  const minTxt = v => v != null ? v + "'" : '';

  const players = t => {
    const rows = ROSTER[t].map(p => {
      const g = S.goals.filter(x => x.team === t && x.nr === p[0]), ps = S.pens.filter(x => x.team === t && x.nr === p[0]);
      return { nr: p[0], name: p[1], pos: p[2], goals: g.filter(x => !x.miss).length, s7: g.filter(x => x.pen).length, s7g: g.filter(x => x.pen && !x.miss).length,
        W: ps.filter(x => x.type === 'W').length, two: ps.filter(x => x.type === '2').length, D: ps.filter(x => x.type === 'D' || x.type === 'N').length };
    }).sort((x, y) => y.goals - x.goals || (POS_ORDER[x.pos] || 9) - (POS_ORDER[y.pos] || 9) || x.nr - y.nr);
    const top = rows[0] && rows[0].goals ? rows[0].goals : 0;
    const body = rows.map(r => `<tr class="${r.goals || r.W || r.two || r.D ? '' : 'idle'}"><td class="nr">${r.nr}</td><td>${esc(r.name)}</td><td class="pos">${esc(r.pos)}</td>` +
      `<td class="num gl${r.goals && r.goals === top ? ' best' : ''}">${nz(r.goals)}</td><td class="num">${r.s7 ? r.s7g + '/' + r.s7 : nz(0)}</td>` +
      `<td class="num">${nz(r.W)}</td><td class="num">${nz(r.two)}</td><td class="num">${nz(r.D)}</td></tr>`).join('');
    const unk = S.goals.filter(x => x.team === t && x.nr == null && !x.miss).length;
    const off = OFFICIALS.map(o => {
      const ps = S.pens.filter(x => x.team === t && x.nr === o);
      return ps.length ? `<tr><td class="nr">${o}</td><td>osoba towarzysząca</td><td></td><td class="num"></td><td class="num"></td>` +
        `<td class="num">${nz(ps.filter(x => x.type === 'W').length)}</td><td class="num">${nz(ps.filter(x => x.type === '2').length)}</td><td class="num">${nz(ps.filter(x => x.type === 'D' || x.type === 'N').length)}</td></tr>` : '';
    }).join('');
    return `<table class="pl"><thead><tr><th class="nr">Nr</th><th>Zawodnik</th><th class="pos">P</th><th class="num">Gole</th><th class="num" title="rzuty karne: bramki / rzuty">7m</th><th class="num">W</th><th class="num">2'</th><th class="num">D</th></tr></thead>
      <tbody>${body}${unk ? `<tr><td class="nr">?</td><td><i>strzelec nieznany</i></td><td></td><td class="num gl">${unk}</td><td colspan="4"></td></tr>` : ''}${off}</tbody>
      <tfoot><tr><td></td><td>Razem</td><td></td><td class="num gl">${st[t].goals}</td><td class="num">${st[t].s7g}/${st[t].s7}</td><td class="num">${st[t].W}</td><td class="num">${st[t].two}</td><td class="num">${st[t].D}</td></tr></tfoot></table>`;
  };
  const best = t => {
    const c = {};
    S.goals.filter(x => x.team === t && !x.miss && x.nr != null).forEach(x => c[x.nr] = (c[x.nr] || 0) + 1);
    const n = Math.max(0, ...Object.values(c));
    if (!n) return '—';
    return Object.keys(c).filter(k => c[k] === n).map(k => { const p = person(t, +k); return `${esc(surname(p))} (${p[0]})`; }).join(', ') + ` — ${n}`;
  };
  const cmp = (label, a, b, va = a, vb = b) => {
    const mx = Math.max(va, vb, 1);
    return `<div class="cmp"><b class="va">${a}</b><div class="bar ba"><i style="width:${(va / mx * 100).toFixed(0)}%"></i></div><span>${label}</span><div class="bar bb"><i style="width:${(vb / mx * 100).toFixed(0)}%"></i></div><b class="vb">${b}</b></div>`;
  };
  const runTxt = s => s.run ? `${s.run}:0${s.runFrom != null ? ` <small>(${minTxt(s.runFrom)}–${minTxt(s.runTo)})</small>` : ''}` : '—';
  const leadTxt = s => s.lead ? `+${s.lead}${s.leadMin != null ? ` <small>(${minTxt(s.leadMin)})</small>` : ''}` : '—';

  const evRows = h => T.events.filter(e => e.half === h).map(e => {
    const p = e.p, tc = e.team.toLowerCase();
    let what = p ? `<b>${p[0]}</b> ${esc(OFFICIALS.includes(p[0]) ? 'osoba towarzysząca' : p[1])}${e.nth ? ` <small>(${e.nth})</small>` : ''}` : '<i>strzelec nieznany</i>';
    let sc = `${e.a}:${e.b}`, cls = tc, df = '';
    if (e.kind === 'pen') { what = `<span class="chip c${e.type}">${penLabel(e.type)}</span> ${what}`; sc = ''; cls += ' pen'; }
    else if (e.miss) { what += ' <span class="tag x">7m niewykorzystany</span>'; cls += ' miss'; }
    else {
      if (e.pen) what += ' <span class="tag">7m</span>';
      const d = e.a - e.b;
      df = `<small class="df ${d > 0 ? 'a' : d < 0 ? 'b' : ''}">${d > 0 ? '+' + d : d}</small>`;
    }
    if (e.note) what += `<div class="note">${esc(e.note)}</div>`;
    const side = `<td class="side ${tc}">${what}</td>`;
    return `<tr class="${cls}"><td class="min">${e.min != null ? e.min + "'" : '–'}</td>${e.team === 'A' ? side : '<td></td>'}<td class="sc">${sc}${df}</td>${e.team === 'B' ? side : '<td></td>'}</tr>`;
  }).join('') || '<tr><td colspan="4" class="empty">brak zdarzeń</td></tr>';
  const half = (h, label) => `<div class="half"><h3>${label}<span>${h === 1 ? `${ht.a}:${ht.b}` : `${last.a - ht.a}:${last.b - ht.b}`}</span></h3>
    <table class="ev"><thead><tr><th class="min"></th><th class="a">${esc(m.A.short)}</th><th class="sc">wynik</th><th class="b">${esc(m.B.short)}</th></tr></thead><tbody>${evRows(h)}</tbody></table></div>`;

  const css = `
:root { --a: #1f5fbf; --a2: #e6eefb; --b: #c0392b; --b2: #fbe9e7; --ink: #1d2330; --mu: #6b7280; --ln: #e3e6ea; --bg: #f4f5f7; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.page { max-width: 1100px; margin: 0 auto; padding: 18px 16px 28px; }
.tools { display: flex; gap: 8px; justify-content: flex-end; margin-bottom: 10px; }
.tools button { font: inherit; font-weight: 700; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--ln); background: #fff; cursor: pointer; }
.card { background: #fff; border: 1px solid var(--ln); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; break-inside: avoid; }
h2 { margin: 0 0 10px; font-size: 15px; text-transform: uppercase; letter-spacing: .04em; color: var(--mu); }
.meta { text-align: center; color: var(--mu); font-size: 13px; }
.score { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 18px; margin-top: 8px; }
.score .t { font-size: 24px; font-weight: 800; } .score .t.a { color: var(--a); text-align: right; } .score .t.b { color: var(--b); }
.score .r { font-size: 56px; font-weight: 900; font-variant-numeric: tabular-nums; text-align: center; line-height: 1; }
.score .r small { display: block; font-size: 13px; font-weight: 500; color: var(--mu); margin-top: 6px; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 8px; }
.fact { border: 1px solid var(--ln); border-radius: 10px; padding: 8px 10px; }
.fact span { display: block; font-size: 11px; color: var(--mu); text-transform: uppercase; letter-spacing: .03em; }
.fact .ab { display: flex; justify-content: space-between; gap: 8px; font-weight: 700; margin-top: 2px; }
.fact .ab .a { color: var(--a); } .fact .ab .b { color: var(--b); text-align: right; }
.cmp { display: grid; grid-template-columns: 56px 1fr 170px 1fr 56px; align-items: center; gap: 8px; padding: 4px 0; border-bottom: 1px solid var(--ln); }
.cmp:last-child { border-bottom: 0; }
.cmp span { text-align: center; color: var(--mu); font-size: 13px; } .cmp .va { text-align: right; color: var(--a); } .cmp .vb { color: var(--b); }
.bar { height: 10px; background: #f0f2f5; border-radius: 5px; display: flex; overflow: hidden; } .bar.ba { justify-content: flex-end; }
.bar i { display: block; height: 100%; border-radius: 5px; } .ba i { background: var(--a); } .bb i { background: var(--b); }
svg { width: 100%; height: auto; display: block; }
svg text { font-size: 12px; fill: var(--mu); } svg .la, svg .va { fill: var(--a); font-weight: 700; } svg .lb, svg .vb { fill: var(--b); font-weight: 700; }
svg .gl { stroke: #e6e8ec; } svg .g5 { stroke: #f2f3f5; } svg .ht { stroke: #b9bec6; stroke-dasharray: 5 4; } svg .htl { font-size: 11px; }
svg .zero { stroke: #9aa1ab; } svg .fa { fill: var(--a); opacity: .16; } svg .fb { fill: var(--b); opacity: .16; }
svg .ln { fill: none; stroke: var(--ink); stroke-width: 2; } svg .da { fill: var(--a); } svg .db { fill: var(--b); }
svg .ba { fill: var(--a); } svg .bb { fill: var(--b); }
.legend { display: flex; gap: 14px; justify-content: center; font-size: 12px; color: var(--mu); margin-top: 4px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.team.a h2 { color: var(--a); } .team.b h2 { color: var(--b); }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 4px 6px; border-bottom: 1px solid var(--ln); text-align: left; vertical-align: top; }
th { font-size: 11px; color: var(--mu); font-weight: 600; }
.nr { width: 30px; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; } .pos { width: 18px; color: var(--mu); font-size: 12px; }
.num { width: 38px; text-align: center; font-variant-numeric: tabular-nums; } .gl { font-weight: 800; } .best { background: #fff4c2; }
.pl tr.idle td { color: #9aa1ab; } .z { color: #cdd1d6; } tfoot td { font-weight: 700; border-top: 2px solid var(--ln); border-bottom: 0; }
.half h3 { display: flex; justify-content: space-between; margin: 0 0 6px; font-size: 14px; }
.ev { table-layout: fixed; font-size: 13px; }
.ev .min { width: 38px; color: var(--mu); font-variant-numeric: tabular-nums; } .ev .sc { width: 64px; text-align: center; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
.ev th.a { color: var(--a); } .ev th.b { color: var(--b); text-align: right; }
.ev td.side.a { background: var(--a2); } .ev td.side.b { background: var(--b2); text-align: right; }
.ev .side.a b { color: var(--a); } .ev .side.b b { color: var(--b); }
.ev tr.miss td { color: var(--mu); } .ev .df { display: block; font-size: 10px; font-weight: 700; color: var(--mu); } .ev .df.a { color: var(--a); } .ev .df.b { color: var(--b); }
.ev .note { font-size: 11px; color: var(--mu); } .empty { text-align: center; color: var(--mu); }
.tag { font-size: 10px; font-weight: 700; padding: 0 5px; border-radius: 8px; background: #f3e5f5; color: #8e44ad; } .tag.x { background: #eceff1; color: #546e7a; }
.chip { font-size: 10px; font-weight: 700; padding: 0 5px; border-radius: 8px; background: #fff4e0; color: #b7791f; }
.chip.cD, .chip.cN { background: #fde8e8; color: var(--b); } .chip.cW { background: #fff9c4; color: #8a6d00; }
.sig { text-align: right; color: var(--mu); font-size: 12px; margin-top: 6px; }
@media (max-width: 760px) { .two { grid-template-columns: 1fr; } .score .r { font-size: 40px; } .score .t { font-size: 18px; } .cmp { grid-template-columns: 40px 1fr 110px 1fr 40px; } }
@page { size: A4; margin: 10mm; }
@media print { body { background: #fff; font-size: 11px; } .tools { display: none; } .page { padding: 0; max-width: none; } .card { border-color: #d5d9de; padding: 8px 10px; margin-bottom: 8px; } .score .r { font-size: 40px; } .ev { font-size: 10.5px; } th, td { padding: 2px 4px; } }
`;
  const sevenTxt = s => `${s.s7g}/${s.s7}`;
  return `<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raport: ${esc(m.A.short)} ${last.a}:${last.b} ${esc(m.B.short)}</title><style>${css}</style></head>
<body><div class="page">
<div class="tools"><button onclick="window.print()">Drukuj / PDF</button><button onclick="saveReport()">Zapisz raport</button></div>
<section class="card">
  <div class="meta">${meta}</div>
  <div class="score"><div class="t a">${esc(m.A.name)}</div><div class="r">${last.a} : ${last.b}<small>do przerwy ${ht.a} : ${ht.b} · II połowa ${last.a - ht.a} : ${last.b - ht.b}</small></div><div class="t b">${esc(m.B.name)}</div></div>
</section>
<section class="card"><h2>Najważniejsze</h2><div class="facts">
  <div class="fact"><span>Najlepszy strzelec</span><div class="ab"><b class="a">${best('A')}</b><b class="b">${best('B')}</b></div></div>
  <div class="fact"><span>Największa przewaga</span><div class="ab"><b class="a">${leadTxt(st.A)}</b><b class="b">${leadTxt(st.B)}</b></div></div>
  <div class="fact"><span>Najdłuższa seria bramek</span><div class="ab"><b class="a">${runTxt(st.A)}</b><b class="b">${runTxt(st.B)}</b></div></div>
  <div class="fact"><span>Remisy · zmiany prowadzenia</span><div class="ab"><b>${R.ties} · ${R.changes}</b></div></div>
</div></section>
<section class="card"><h2>Porównanie drużyn</h2>
  ${cmp('Bramki', st.A.goals, st.B.goals)}
  ${cmp('I połowa', st.A.h1, st.B.h1)}
  ${cmp('II połowa', st.A.h2, st.B.h2)}
  ${cmp('Rzuty karne (bramki/rzuty)', sevenTxt(st.A), sevenTxt(st.B), st.A.s7g, st.B.s7g)}
  ${cmp('Ostrzeżenia', st.A.W, st.B.W)}
  ${cmp("Wykluczenia 2'", st.A.two, st.B.two)}
  ${cmp('Dyskwalifikacje', st.A.D, st.B.D)}
  ${cmp('Największa przewaga', st.A.lead, st.B.lead)}
  ${cmp('Najdłuższa seria', st.A.run, st.B.run)}
</section>
<section class="card"><h2>Przebieg meczu — przewaga</h2>${reportLeadChart(goals)}</section>
<section class="card"><h2>Bramki w odcinkach 10 minut</h2>${reportSegChart(R.seg)}
  <div class="legend"><span><i style="background:var(--a)"></i>${esc(m.A.short)}</span><span><i style="background:var(--b)"></i>${esc(m.B.short)}</span></div></section>
<div class="two">
  <section class="card team a"><h2>A — ${esc(m.A.name)}</h2>${players('A')}</section>
  <section class="card team b"><h2>B — ${esc(m.B.name)}</h2>${players('B')}</section>
</div>
<section class="card"><h2>Przebieg zawodów</h2><div class="two">${half(1, 'I połowa')}${half(2, 'II połowa')}</div></section>
<div class="sig">Sportomatyka „Bawimy się danymi”</div>
</div>
<script>
function saveReport() {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['<!doctype html>' + document.documentElement.outerHTML], { type: 'text/html' }));
  a.download = ${JSON.stringify(name)};
  a.click();
}
<\/script>
</body></html>`;
}

initStart();
</script>
</body>
</html>
